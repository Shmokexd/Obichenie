<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380"><rect width="640" height="380" fill="#fff"/><rect x="40" y="60" width="560" height="230" fill="#e4e4e2" stroke="#8c8c88" stroke-width="2"/><circle cx="70" cy="80" r="4" fill="#b8b8b4"/><circle cx="160" cy="250" r="4" fill="#b8b8b4"/><circle cx="300" cy="120" r="4" fill="#b8b8b4"/><circle cx="420" cy="230" r="4" fill="#b8b8b4"/><circle cx="540" cy="90" r="4" fill="#b8b8b4"/><circle cx="500" cy="270" r="4" fill="#b8b8b4"/><circle cx="230" cy="175" r="20" fill="#d9dde1" stroke="#5c636a" stroke-width="3"/><circle cx="230" cy="175" r="7" fill="#5c636a"/><circle cx="450" cy="175" r="20" fill="#d9dde1" stroke="#5c636a" stroke-width="3"/><circle cx="450" cy="175" r="7" fill="#5c636a"/><line x1="40" y1="135" x2="210" y2="135" stroke="#c0622d" stroke-width="3"/><polygon points="40,135 52,128 52,142" fill="#c0622d"/><polygon points="210,135 198,128 198,142" fill="#c0622d"/><text x="125" y="122" font-family="DejaVu Sans, Arial" font-size="18" font-weight="700" fill="#c0622d" text-anchor="middle">от края ≥ 2 h</text><line x1="250" y1="215" x2="430" y2="215" stroke="#c0622d" stroke-width="3"/><polygon points="250,215 262,208 262,222" fill="#c0622d"/><polygon points="430,215 418,208 418,222" fill="#c0622d"/><text x="340" y="245" font-family="DejaVu Sans, Arial" font-size="18" font-weight="700" fill="#c0622d" text-anchor="middle">между ≥ 3 h</text><text x="320" y="40" font-family="DejaVu Sans, Arial" font-size="20" font-weight="700" fill="#2b2f33" text-anchor="middle">Бетон, вид сверху</text><text x="320" y="330" font-family="DejaVu Sans, Arial" font-size="18" font-weight="400" fill="#2b2f33" text-anchor="middle">h — глубина анкеровки (на сколько анкер ушёл в стену)</text><text x="320" y="356" font-family="DejaVu Sans, Arial" font-size="18" font-weight="400" fill="#6b7076" text-anchor="middle">Ближе к краю — бетон откалывается вместе с анкером</text></svg>