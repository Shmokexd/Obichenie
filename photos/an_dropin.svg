<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
<rect width="480" height="360" fill="#fff"/>
<defs>
<linearGradient id="z" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset=".35" stop-color="#c9cfd5"/><stop offset=".7" stop-color="#9aa3ac"/><stop offset="1" stop-color="#6f7882"/></linearGradient>
<linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9bfc5"/><stop offset=".5" stop-color="#7d858d"/><stop offset="1" stop-color="#4f565d"/></linearGradient>
</defs>
<!-- анкер забивной: гильза с прорезями, сбоку видна внутренняя резьба у торца -->
<g transform="translate(70 70)">
<rect x="0" y="0" width="210" height="64" rx="6" fill="url(#z)" stroke="#6f7882" stroke-width="2"/>
<path d="M140 0 v26 M170 0 v26 M140 64 v-26 M170 64 v-26" stroke="#5b636b" stroke-width="3"/>
<path d="M200 6 l14 10 v32 l-14 10" fill="#b8bfc6" stroke="#6f7882" stroke-width="2"/>
<!-- торец с резьбой -->
<ellipse cx="0" cy="32" rx="14" ry="32" fill="#dfe3e7" stroke="#6f7882" stroke-width="2"/>
<ellipse cx="0" cy="32" rx="7" ry="16" fill="#58606a"/>
<path d="M-6 20 q6 4 12 0 M-7 28 q7 4 14 0 M-7 36 q7 4 14 0 M-6 44 q6 4 12 0" stroke="#9aa3ac" stroke-width="1.6" fill="none"/>
</g>
<!-- забойник -->
<g transform="translate(70 214)">
<rect x="0" y="12" width="250" height="26" rx="4" fill="url(#p)" stroke="#4f565d" stroke-width="2"/>
<rect x="250" y="18" width="70" height="14" rx="3" fill="url(#p)" stroke="#4f565d" stroke-width="2"/>
<rect x="-14" y="4" width="18" height="42" rx="4" fill="#5f666d"/>
</g>
<g font-family="Arial, sans-serif" font-size="18" fill="#3f444a">
<text x="300" y="112">анкер</text>
<text x="335" y="292" text-anchor="middle">забойник</text>
</g>
</svg>
